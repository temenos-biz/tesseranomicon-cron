name: Autogen Daily Trigger
on:
  schedule:
    # Запуск каждый день в 09:00 UTC
    - cron: '0 9 * * *' 
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Autogen Endpoint
        run: |
          curl -f --max-time 900 -X POST https://tesseranomicon-api.onrender.com/autogen/run \
          -H "Content-Type: application/json" \
          -H "X-Autogen-Token: ${{ secrets.AUTOGEN_TOKEN }}" \
          -d '{"triggered_by": "github_cron"}'
